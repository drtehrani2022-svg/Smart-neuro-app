name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev liblzma-dev libbz2-dev libreadline-dev libsqlite3-dev xz-utils tk-dev
          
      # این مرحله جدید است: پاک کردن کش‌های قبلی
      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer
          
      - name: Install Buildozer
        run: |
          pip install --user buildozer==1.5.0 cython==0.29.33
          
      - name: Build
        run: |
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer -v android debug
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Test-APK
          path: bin/*.apk
