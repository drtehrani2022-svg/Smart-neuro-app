name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # افزایش زمان برای بیلدهای طولانی

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize build space (استفاده از هر دو دیسک)
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 30720  # رزرو ۳۰ گیگابایت برای دیسک ریشه
        temp-reserve-mb: 4096   # رزرو ۴ گیگابایت برای دیسک موقت
        swap-size-mb: 10240     # ایجاد ۱۰ گیگابایت Swap
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf automake libtool pkg-config gettext autopoint \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
          libffi-dev libssl-dev liblzma-dev libbz2-dev libreadline-dev \
          libsqlite3-dev xz-utils tk-dev ant g++ gcc lbzip2 libltdl-dev \
          make patch python3-dev python3-venv wget

    - name: Install buildozer and cython
      run: |
        pip install --user buildozer==1.5.0 cython==0.29.33

    - name: Configure memory and Gradle
      run: |
        export _JAVA_OPTIONS="-Xmx4G"
        export GRADLE_OPTS="-Xmx4096m -Dorg.gradle.daemon=false"

    - name: Clean previous builds
      run: |
        rm -rf .buildozer

    - name: Build APK
      run: |
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer -v android debug 2>&1 | tee buildozer.log

    - name: Show build errors (if any)
      if: always()
      run: |
        echo "=== Last 200 lines of build log ==="
        tail -200 buildozer.log
        echo "=== Search for errors ==="
        grep -nE "FAILED|ERROR|Traceback|Exception|BUILD FAILED|Command failed|returned non-zero" buildozer.log | tail -50

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: smart-neuro-app-apk
        path: bin/*.apk
